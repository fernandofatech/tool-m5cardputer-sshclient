# Gerado por fernandofatech/platform. Não edite aqui.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: fernandofatech/platform/.github/workflows/ci-generic.yml@main

  seguranca:
    uses: fernandofatech/platform/.github/workflows/security.yml@main
    secrets: inherit
    with:
      sonar_host: ""
      defectdojo_host: ""

  release:
    needs: [ci]
    # Só corta versão se o CI passou: tag apontando para código quebrado é
    # pior que não ter tag.
    if: success()
    uses: fernandofatech/platform/.github/workflows/release.yml@main
    permissions:
      contents: write
