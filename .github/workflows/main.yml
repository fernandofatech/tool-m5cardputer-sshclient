# Gerado por fernando-moretes/platform. Não edite aqui.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: fernando-moretes/platform/.github/workflows/ci-generic.yml@main

  seguranca:
    uses: fernando-moretes/platform/.github/workflows/security.yml@main
    secrets: inherit
    with:
      sonar_host: "http://192.168.15.51:9000"
      defectdojo_host: "http://192.168.15.51:8080"

  release:
    needs: [ci]
    # Só corta versão se o CI passou: tag apontando para código quebrado é
    # pior que não ter tag.
    if: success()
    uses: fernando-moretes/platform/.github/workflows/release.yml@main
    permissions:
      contents: write
