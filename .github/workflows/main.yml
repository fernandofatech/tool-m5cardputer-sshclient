# Gerado por fernando-moretes/platform. Não edite aqui.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: fernando-moretes/platform-workflows/.github/workflows/ci-generic.yml@main
    with:
      runner: '["ubuntu-latest"]'

  seguranca:
    # O chamador precisa conceder o que o workflow chamado pede: um reusable
    # workflow nao pode escalar alem da permissao de quem o chamou, e sem isto
    # o run falha antes de comecar.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: fernando-moretes/platform-workflows/.github/workflows/security.yml@main
    secrets: inherit
    with:
      runner: '["ubuntu-latest"]'
      sonar_host: ""
      defectdojo_host: ""

  release:
    needs: [ci]
    # Só corta versão se o CI passou: tag apontando para código quebrado é
    # pior que não ter tag.
    if: success()
    uses: fernando-moretes/platform-workflows/.github/workflows/release.yml@main
    with:
      runner: '["ubuntu-latest"]'
    permissions:
      contents: write
