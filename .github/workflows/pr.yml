# Gerado por fernando-moretes/platform. Não edite aqui: mude no orquestrador e
# rode `make rollout`, senão a alteração é sobrescrita na próxima sincronização.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: fernando-moretes/platform-workflows/.github/workflows/pr-lint.yml@main
    with:
      runner: '["ubuntu-latest"]'

  ci:
    uses: fernando-moretes/platform-workflows/.github/workflows/ci-generic.yml@main
    with:
      runner: '["ubuntu-latest"]'

  seguranca:
    # O chamador precisa conceder o que o workflow chamado pede: um reusable
    # workflow nao pode escalar alem da permissao de quem o chamou, e sem isto
    # o run falha antes de comecar.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: fernando-moretes/platform-workflows/.github/workflows/security.yml@main
    secrets: inherit
    with:
      runner: '["ubuntu-latest"]'
      sonar_host: "https://sonarqube.home.lab"
      defectdojo_host: "https://defectdojo.home.lab"
