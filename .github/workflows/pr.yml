# Gerado por fernando-moretes/platform. Não edite aqui: mude no orquestrador e
# rode `make rollout`, senão a alteração é sobrescrita na próxima sincronização.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: fernando-moretes/platform-workflows/.github/workflows/pr-lint.yml@main
    with:
      runner: '["ubuntu-latest"]'

  ci:
    uses: fernando-moretes/platform-workflows/.github/workflows/ci-generic.yml@main
    with:
      runner: '["ubuntu-latest"]'

# A varredura de seguranca NAO roda em PR, e sai cara se voltar sem pensar: ela
# pede `security-events: write` para subir SARIF ao code scanning, e PR do
# dependabot recebe token somente-leitura. Como o GitHub valida o que cada
# reusable workflow pede ao LER o arquivo — antes de qualquer `if:` —, a simples
# presenca da chamada derrubava todo PR do dependabot em startup_failure, sem
# rodar lint nem CI.
#
# O `main.yml` varre tudo depois do merge, que e onde o SARIF vira alerta
# versionado de qualquer forma. Para trazer de volta ao PR seria preciso ou
# separar um workflow so para PR de humano, ou abrir mao do upload do SARIF.
