# Gerado por fernando-moretes/platform. Não edite aqui: mude no orquestrador e
# rode `make rollout`, senão a alteração é sobrescrita na próxima sincronização.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: fernando-moretes/platform/.github/workflows/pr-lint.yml@main

  ci:
    uses: fernando-moretes/platform/.github/workflows/ci-generic.yml@main

  seguranca:
    uses: fernando-moretes/platform/.github/workflows/security.yml@main
    secrets: inherit
    with:
      sonar_host: "http://192.168.15.51:9000"
      defectdojo_host: "http://192.168.15.51:8080"
